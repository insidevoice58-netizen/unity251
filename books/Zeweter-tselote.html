<h2>📿 ዘወትር ጸሎት</h2>

<p>
በአብ ወበወልድ ወበመንፈስ ቅዱስ፤ አሐዱ አምላክ። አሜን።
</p>

<p>
አባታችን ሆይ በሰማያት የምትኖር፣ ስምህ ይቀደስ፤
መንግሥትህ ትምጣ፤ ፈቃድህ በሰማይ እንደሆነ
በምድርም ይሁን።
</p>
